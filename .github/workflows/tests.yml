name: Synthetic validation
on: [push, pull_request]
jobs:
  test:
    # The pinned environment and the path guard are Windows-specific (drive-letter paths).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      # Synthetic fixtures only. Slow MATLAB/TUEG end-to-end tests are opt-in via FSMS_RUN_SLOW=1 and are
      # skipped here (no MATLAB, no TUEG corpus, and never any real study data).
      - name: Unit tests
        shell: bash
        run: |
          set +e
          python -B -m unittest discover -s tests -v > test_output.txt 2>&1
          status=$?
          tail -n 80 test_output.txt
          if [ "$status" -ne 0 ]; then
            # Surface the failure as a public annotation (job logs need a signed-in viewer).
            python - <<'PY'
          import re
          text = open("test_output.txt", encoding="utf-8", errors="replace").read()
          lines = [l for l in text.splitlines()
                   if re.match(r"^(FAIL|ERROR): ", l) or re.match(r"^\w*(Error|Exception)\b", l)
                   or l.startswith("AssertionError") or l.lstrip().startswith("File \"") and "tests" in l]
          message = "\n".join(lines[:25]) or text[-1500:]
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=unit tests failed::" + message[:3500])
          PY
            exit 1
          fi
      - run: python -B -m fsms.provenance --verify
      - name: Verify plan lock
        shell: bash
        run: python -B run_pipeline.py verify-lock
